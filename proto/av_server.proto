syntax = "proto3";

package pisa_api;

import "config.proto";
import "control.proto";
import "empty.proto";
import "object.proto";
import "pong.proto";
import "path.proto";
import "scenario.proto";

message ObservedAgent {
  ObjectState state = 1;
  // Identity metadata is optional because an AV may not associate observations.
  optional uint64 tracking_id = 2;
  optional string entity_name = 3;
}

message Observation {
  // Ego is semantically explicit.
  ObjectState ego = 1;
  // Agent order carries no actor identity.
  repeated ObservedAgent agents = 2;
}

service AvServer {
  // Check if the server is alive
  rpc Ping(Empty) returns (Pong);

  // Initialize the AV system with configuration parameters
  rpc Init(AvServerMessages.InitRequest) returns (Empty);

  // Reset the AV system with a new scenario and initial observation
  rpc Reset(AvServerMessages.ResetRequest) returns (AvServerMessages.ResetResponse);

  // Advance the AV system by one step with the provided observation
  rpc Step(AvServerMessages.StepRequest) returns (AvServerMessages.StepResponse);

  // Stop the AV system
  rpc Stop(Empty) returns (Empty);

  // Close the AV server
  rpc Close(Empty) returns (Empty);

  // Check if the AV system should quit
  rpc ShouldQuit(Empty) returns (AvServerMessages.ShouldQuitResponse);
}

message AvServerMessages {
  message InitRequest {
    Config config     = 1;
    Path   output_dir = 2;
    string map_name   = 3;
    double dt         = 4;
  }

  message ResetRequest {
    reserved 3;

    Path                 output_dir          = 1;
    ScenarioPack         scenario_pack       = 2;
    Observation          initial_observation = 4;
  }

  message ResetResponse {
    CtrlCmd ctrl_cmd = 1;
  }

  message StepRequest {
    reserved 1;

    Observation          observation  = 3;
    int64                timestamp_ns = 2;
  }

  message StepResponse {
    CtrlCmd ctrl_cmd = 1;
  }

  message ShouldQuitResponse {
    bool   should_quit = 1;
    string msg         = 2;
  }
}
