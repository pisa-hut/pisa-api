syntax = "proto3";

package pisa_api;

enum RoadObjectType {
  UNKNOWN     = 0;
  CAR         = 1;
  TRUCK       = 2;
  BUS         = 3;
  SEMITRAILER = 4;
  TRAILER     = 5;
  MOTORCYCLE  = 6;
  BICYCLE     = 7;
  PEDESTRIAN  = 8;
  VAN         = 9;
  TRAIN       = 10;
  TRAM        = 11;
  WHEEL_CHAIR = 12;
  ANIMAL      = 13;
}

enum ShapeType {
  BOUNDING_BOX = 0;
  CYLINDER     = 1;
  POLYGON      = 2;
}

// A three-dimensional vector in the canonical world coordinate frame.
message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message ObjectKinematic {
  // Timestamp in nanoseconds.
  int64  time_ns = 1;
  double x       = 2;
  double y       = 3;
  double z       = 4;
  double yaw     = 5;

  // Unit: m/s. Signed longitudinal speed along the object's forward direction.
  // This is not the Euclidean magnitude of linear_velocity and may be negative
  // when the object moves backward.
  double speed        = 6;
  double acceleration = 7;

  double yaw_rate         = 8;
  double yaw_acceleration = 9;

  // Optional authoritative linear velocity.
  // Unit: m/s. Components use the same canonical world coordinate frame as x/y/z
  // and are sampled at the same time_ns. The vector includes longitudinal,
  // lateral, and vertical components. An absent field means that the producer
  // does not provide full vector velocity; a present (0, 0, 0) value means that
  // the producer explicitly reports zero velocity.
  Vector3 linear_velocity = 10;

  // Optional authoritative steering tire angle feedback.
  // Unit: radians. Uses the PISA canonical/ROS sign convention: left is
  // positive and right is negative. The value is sampled at the same time_ns.
  // An absent field means that the producer does not provide steering
  // feedback; a present 0.0 value explicitly reports zero steering angle.
  // This is simulator state feedback, not a control command.
  optional double steering_tire_angle = 11;
}

message Shape{
  ShapeType type = 4;
  message Dimension {
    double x = 1;
    double y = 2;
    double z = 3;
  }
  Dimension dimensions = 2; // length, width, height for bounding box; radius, height for cylinder; ignored for polygon
  message Vertex {
    double x = 1;
    double y = 2;
    double z = 3;
  }
  repeated Vertex vertices = 3; // ignored for bounding box and cylinder; list of vertices
  message CenterPose {
    double x = 1;
    double y = 2;
    double z = 3;
    double roll = 4;
    double pitch = 5;
    double yaw = 6;
  }
  // Shape center in the local frame of ObjectKinematic.
  CenterPose center = 5;
  string reference_point = 6;
}

message ObjectState{
  RoadObjectType  type      = 1;
  ObjectKinematic kinematic = 2;
  optional Shape  shape     = 3;
}
